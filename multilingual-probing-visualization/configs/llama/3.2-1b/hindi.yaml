dataset:
  observation_fieldnames:
    - index
    - sentence
    - lemma_sentence
    - upos_sentence
    - xpos_sentence
    - morph
    - head_indices
    - governance_relations
    - secondary_relations
    - extra_info
    - langs
    - embeddings
  corpus:
    root: datasets
    train_path: train.conllu
    dev_path: dev.conllu
    test_path: test.conllu
  keys:
    train: ['hi']
    dev: ['hi']
    test: ['hi']
  batch_size: 16
model:
  hidden_dim: 3072
  model_type: decoder-transformer-lens
  use_disk: True
  model_layer: 16
decoder_model:
  model_name: meta-llama/Llama-3.1-1B
  activation_name: resid_post
  layer: 16
  batch_size: 2
  dtype: bfloat16
  padding_side: right
  cache_dir: /home/sparsh/.cache/huggingface
  local_path: none        # replace with /path/to/local/llama if available
  prepend_bos: true
  append_eos: false
probe:
  task_signature: word_pair
  task_name: parse-distance
  maximum_rank: 64
  psd_parameters: True
  diagonal: False
  params_path: predictor.params
probe_training:
  epochs: 30
  loss: L1
reporting:
  root: experiments/llama-3p1-1b/hi
  observation_paths:
    train_path: train.observations
    dev_path: dev.observations
    test_path: test.observations
  prediction_paths:
    train_path: train.predictions
    dev_path: dev.predictions
    test_path: test.predictions
  reporting_methods:
    - spearmanr
    - uuas
    - tsne
