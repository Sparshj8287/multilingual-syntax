dataset:
  observation_fieldnames:
    - index
    - sentence
    - lemma_sentence
    - upos_sentence
    - xpos_sentence
    - morph
    - head_indices
    - governance_relations
    - secondary_relations
    - extra_info
    - langs
    - embeddings
  corpus:
    root: datasets
    train_path: train.conllu
    dev_path: dev.conllu
    test_path: test.conllu
  keys:
    train: ['en']
    dev: ['en']
    test: ['en']
  batch_size: 16
model:
  hidden_dim: 4096
  model_type: decoder-transformer-lens
  use_disk: True
  model_layer: 16
  layers: [0, 5, 10, 15]
decoder_model:
  model_name: allenai/Olmo-3-1025-7B
  activation_name: resid_post
  layer: 16
  batch_size: 8
  dtype: bfloat16
  padding_side: right
  use_vendor_transformer_lens: True
  cache_dir: /home/sparsh/.cache/huggingface
  local_path: none
probe:
  task_signature: word_pair
  task_name: parse-distance
  maximum_rank: 128
  psd_parameters: True
  diagonal: False
  params_path: predictor.params
  use_polar: False
probe_training:
  epochs: 30
  loss: L1
  angular_lambda: 10
reporting:
  root: experiments/olmo-3-7b/en
  group_by_seed: True
  observation_paths:
    train_path: train.observations
    dev_path: dev.observations
    test_path: test.observations
  prediction_paths:
    train_path: train.predictions
    dev_path: dev.predictions
    test_path: test.predictions
  reporting_methods:
    - spearmanr
    - uuas
    - polar_metrics
seed: 42
