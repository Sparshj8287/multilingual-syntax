evaluation:
  input_root: ../data/obj_rel_across_anim/test
  output_root: results
  dataset_name: obj_rel_across_anim_test
  input_variations:
    - linear
    - bow
    - maximal
  input_glob: "*.jsonl"
  sample_logs_per_file: 50
  random_seed: 13
  show_progress_bar: true

inference:
  torch_dtype: bfloat16
  device_map: auto
  use_fast_tokenizer: true
  # cuda_device: 0

models:
  - name: gemma-3-27b-pt
    checkpoint: google/gemma-3-27b-pt
