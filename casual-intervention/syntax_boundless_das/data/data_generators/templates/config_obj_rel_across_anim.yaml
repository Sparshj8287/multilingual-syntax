# Configuration for obj_rel_across_anim generation

generation:
  # Required

  num_attractors: [1, 2, 3, 4, 5, 6]
  num_pairs: 3000

  # Attractor-number variation for the Base sentence (MS/MV singular):
  # - linear: first N-1 singular, last plural
  # - bow: first N-1 plural, last singular
  # - maximal: all N plural
  # Source sentence (MS/MV plural) is always the exact inverse pattern.
  variation_type: [linear, bow, maximal]

  # Reproducibility
  seed: 13

  # Generation mode(s):
  # - [anim] -> animate-only generation
  # - [inanim] -> inanimate-only generation
  # - [anim, inanim] -> split num_pairs across both categories
  mode: [anim, inanim]

lexicon:
  # Complementizers (animate/inanimate lists)
  c_words_anim:
    - who
    - that
    - whom
  c_words_inanim:
    - that

  # Determiner list (D). Generator always uses "the".
  d_words:
    - the

paths:
  nouns: ../../eng/raw_data_cleaned/noun/gemini_nouns_test.jsonl
  verbs: ../../eng/raw_data_cleaned/verb/gemini_verbs_test.jsonl
  filtered_verbs: ../../eng/raw_data_cleaned/verb/gemini_verbs_mv_test.jsonl

output:
  # Script creates variation subfolders automatically under this root.
  paradigm: obj_rel_across_anim
  data_dir: data
  split: test

filtering_without_ac:
  input_root: data/obj_rel_across_anim
  output_root: data/cleaned_obj_rel_across_anim
  variations:
    - linear
    - bow
    - maximal

  models:
    gemma-3-12b-pt: google/gemma-3-12b-pt
    llama-3.1-8b: /home/models/Llama-3.1-8B
    qwen-3-8b: Qwen/Qwen3-8B-Base
    olmo-3-7b: allenai/Olmo-3-1025-7B

  samples_per_model_case: 5
  final_samples_per_file: 10
  seed: 13
  show_progress_bar: true
  use_fast_tokenizer: true
  torch_dtype: bfloat16
  device_map: auto
  # cuda_device: 0
