# Natural-text (Linzen 2016 Wikipedia) Boundless DAS -- answer to Reviewer kuMV.
#   train/val : semi-natural tier, pure-tier sentences removed  (5,691 rows)
#   test      : pure tier, never trained on                     (993 rows)
# dataset_name: linzen_nat -> H_syn targets; linzen_nat_2 -> H_prox targets.
model:
  name: gemma-3-12b-pt
  path: google/gemma-3-12b-pt

dataset:
  data_root: ../linzen_das_data/das_jsonl_run
  dataset_name: linzen_nat
  variation: linear
  NUA: [2]
  train_split_dir: train
  test_split_dir: test
  file_name_template: "{dataset_name}_pairs_{variation}_{nua}.jsonl"
  # train_size omitted: everything except the validation rows is used for training.
  val_size: 500
  test_size: 0
  shuffle_seed: 42

runtime:
  device: cuda
  device_map: auto
  torch_dtype: bfloat16
  use_fast_tokenizer: true

intervention:
  layer: [0, 5, 10, 15, 20, 25, 30, 35, 40, 45]
  component: block_output
  unit: pos
  num_dim: 1
  intervene_direction: source_to_base

training:
  seed: 42
  random_rotation_eval: false
  # Base batch size for NUA=1; the script halves it per attractor, so NUA=2 -> 256.
  batch_size: 128
  eval_batch_size: 128
  min_batch_size: 1
  epochs: 20
  early_stopping:
    enabled: true
    monitor_metric: test_accuracy
    patience: 3
    min_delta: 0.005
  best_rotation_checkpoint:
    enabled: true
    root_dir: checkpoints_das_linzen_nat
    file_name: best_rotation_checkpoint.pt
  gradient_accumulation_steps: 1
  init_lr: 1.0e-4
  regularization_coefficient: 0.001
  temperature_schedule: [1.0e-2, 1.0e-7]
  lr_rotate: 1.0e-3
  lr_boundary: 1.0e-2
  warmup_ratio: 0.1
  temperature_start: 50.0
  temperature_end: 0.1
  boundary_loss_weight: 1.0
  log_every_steps: 20

output:
  root_dir: results_das_linzen_nat
  seed_directory:
    enabled: true
    name_template: "seed_{seed}"
  before_training_log: 50_samples_before_training.txt
  after_training_log: 50_samples_after_training.txt
  epoch_tracking:
    enabled: false
    sample_count: 10
    file_name: epoch_test_tracking.txt
  result_file: result.json
